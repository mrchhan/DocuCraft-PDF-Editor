name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: choco install innosetup -y --no-progress
      - run: python scripts/build_windows.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: DocuCraft-windows
          path: |
            dist/installer/*.exe
